# /etc/nginx/sites-available/cointrader  →  coin.revuplan.com → 127.0.0.1:4300
# HTTPS 블록은 certbot --nginx -d coin.revuplan.com 이 추가한다.
server {
    listen 80;
    listen [::]:80;
    server_name coin.revuplan.com;

    access_log /var/log/nginx/cointrader.access.log;
    error_log  /var/log/nginx/cointrader.error.log;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
